<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Builtin Cover 1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body { font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #F7F5F0; position: relative; }
  section { position: absolute; }
</style>
</head>
<body>
<main class="ppt-page-root" data-ppt-slide-size-id="wide-16-9" data-ppt-width="1600" data-ppt-height="900" data-ppt-guard-root="1"><div class="ppt-page-content">
  <div style="position:absolute;left:0;top:0;width:1600px;height:10px;background:#2F6BFF;"></div>
  <div style="position:absolute;left:120px;top:150px;width:8px;height:180px;background:#2F6BFF;border-radius:4px;"></div>
  <section data-block-id="kicker" style="position:absolute;left:160px;top:190px;width:900px;height:34px;font-size:20px;color:#5A6472;letter-spacing:.28em;z-index:2">行业研究 · 2026</section>
  <section data-block-id="title" style="position:absolute;left:160px;top:240px;width:1100px;height:110px;font-size:64px;font-weight:700;color:#1F2430;line-height:1.15;z-index:2">演示文稿主标题</section>
  <section data-block-id="subtitle" style="position:absolute;left:160px;top:390px;width:900px;height:44px;font-size:24px;color:#5A6472;line-height:1.5;z-index:2">副标题：一句话说明本次演示的核心主张</section>
  <div style="position:absolute;left:160px;top:700px;width:120px;height:3px;background:#D8DCE3;"></div>
  <section data-block-id="footer" style="position:absolute;left:160px;top:730px;width:700px;height:28px;font-size:16px;color:#9AA1AC;z-index:2">汇报人 · 部门 · 日期</section>
</div></main>
</body>
</html>
