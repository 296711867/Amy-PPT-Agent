<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Builtin Content 3 Grid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body { font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #F7F5F0; position: relative; }
  section { position: absolute; }
</style>
</head>
<body>
<main class="ppt-page-root" data-ppt-slide-size-id="wide-16-9" data-ppt-width="1600" data-ppt-height="900" data-ppt-guard-root="1"><div class="ppt-page-content">
  <div style="position:absolute;left:0;top:0;width:1600px;height:6px;background:#2F6BFF;"></div>
  <section data-block-id="title" style="position:absolute;left:120px;top:90px;width:1200px;height:66px;font-size:44px;font-weight:700;color:#1F2430;z-index:2">页面标题：一句话结论</section>
  <section data-block-id="summary" style="position:absolute;left:120px;top:180px;width:1100px;height:36px;font-size:19px;color:#5A6472;z-index:2">导语：用一句话解释为什么这三点支撑上面的结论。</section>
  <div style="position:absolute;left:120px;top:280px;width:1360px;height:500px;background:#FFFFFF;border-radius:18px;box-shadow:0 10px 30px rgba(31,36,48,.06);"></div>
  <section data-block-id="item-1" style="position:absolute;left:160px;top:330px;width:380px;height:400px;font-size:20px;color:#1F2430;line-height:1.6;z-index:2">第一个模块的核心观点，用两到三行说清楚。</section>
  <section data-block-id="item-2" style="position:absolute;left:610px;top:330px;width:380px;height:400px;font-size:20px;color:#1F2430;line-height:1.6;z-index:2">第二个模块的核心观点，与第一个并列推进。</section>
  <section data-block-id="item-3" style="position:absolute;left:1060px;top:330px;width:380px;height:400px;font-size:20px;color:#1F2430;line-height:1.6;z-index:2">第三个模块的核心观点，收束到页面结论。</section>
  <div style="position:absolute;left:160px;top:300px;width:60px;height:4px;background:#2F6BFF;border-radius:2px;"></div>
  <div style="position:absolute;left:610px;top:300px;width:60px;height:4px;background:#2F6BFF;border-radius:2px;"></div>
  <div style="position:absolute;left:1060px;top:300px;width:60px;height:4px;background:#2F6BFF;border-radius:2px;"></div>
</div></main>
</body>
</html>
