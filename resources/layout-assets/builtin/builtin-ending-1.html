<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Builtin Ending 1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body { font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #1E2430; position: relative; }
  section { position: absolute; }
</style>
</head>
<body>
<main class="ppt-page-root" data-ppt-slide-size-id="wide-16-9" data-ppt-width="1600" data-ppt-height="900">
  <div style="position:absolute;left:0;top:0;width:1600px;height:8px;background:linear-gradient(90deg,#2F6BFF,#7FA4FF);"></div>
  <section data-block-id="title" style="position:absolute;left:120px;top:300px;width:1360px;height:100px;font-size:68px;font-weight:700;color:#FFFFFF;z-index:2">感谢聆听</section>
  <section data-block-id="takeaway" style="position:absolute;left:120px;top:440px;width:1100px;height:50px;font-size:24px;color:rgba(255,255,255,.72);line-height:1.6;z-index:2">核心结论一句话：听众离场时应记住的那件事。</section>
  <div style="position:absolute;left:120px;top:560px;width:90px;height:3px;background:#2F6BFF;"></div>
  <section data-block-id="footer" style="position:absolute;left:120px;top:590px;width:800px;height:28px;font-size:16px;color:rgba(255,255,255,.5);z-index:2">联系方式 · 下一步行动</section>
</main>
</body>
</html>
